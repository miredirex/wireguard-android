name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: mkdir -p ~/.android && echo "${{ secrets.DEBUG_KEYSTORE }}" | base64 -d > ~/.android/debug.keystore
      - run: ./gradlew :ui:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ui/build/outputs/apk/release/*.apk
